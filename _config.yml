locale: "en-US"
title: "Tom Claudio"
name: "Tom Claudio"
description: "Personal website and portfolio of Tom Claudio, a frontend engineer."
url: "https://t0mclaudio.github.io"
baseurl: ""
repository: "t0mclaudio/t0mclaudio.github.io"

remote_theme: "mmistakes/minimal-mistakes@4.28.0"
minimal_mistakes_skin: "default"

# Silences Sass deprecation warnings that originate in the vendored theme's
# own stylesheets (old @import/division/color-function syntax); warnings
# from Sass we author ourselves would still be shown. quiet_deps covers
# everything the theme pulls in via @import; silence_deprecations covers the
# theme's own entry-point file (main.scss), which Dart Sass always treats as
# "our" code rather than a dependency even though it lives in the theme.
sass:
  quiet_deps: true
  silence_deprecations: ["import"]

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-include-cache

# TODO: fill in avatar, bio, email, and social links (see _data/career_trajectory.yml
# and index.md for other placeholder content that still needs to be replaced).
author:
  name: "Tom Claudio"
  avatar: "/assets/images/tom_placeholder_photo.jpg"
  bio: "Technical co-founder and AI developer. 16 years shipping real products. AIM Masters in Entrepreneurship. Open for short contracts."
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/t0mclaudio"
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:TODO@example.com"

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      read_time: false
      comments: false
      share: false
      related: false

collections:
  pages:
    output: true
    permalink: /:path/

exclude:
  - README.md
